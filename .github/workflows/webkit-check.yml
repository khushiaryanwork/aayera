name: WebKit iPhone check
on:
  workflow_dispatch:
  push:
    branches: [ci/webkit-check]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@latest && npx playwright install webkit
      - run: node scripts/ci/webkit-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: webkit-out, path: out }
