name: WebKit iPhone check
on:
  workflow_dispatch:
  push:
    branches: [ci/webkit-check]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.49.1 pngjs@7
      - name: Live site, home hero + statement on iPhone 16 Plus
        run: node scripts/ci/webkit-check.mjs
        env: { HOME: /root, ONLY: 'none', URL: 'https://aayera.pages.dev' }
      - name: Live site, every page on Mac Safari
        if: always()
        run: node scripts/ci/webkit-check.mjs
        env: { HOME: /root, ONLY: 'Safari Mac', URL: 'https://aayera.pages.dev' }
