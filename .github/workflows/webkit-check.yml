name: WebKit iPhone check
on:
  workflow_dispatch:
  push:
    branches: [ci/webkit-check]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.49.1 pngjs@7
      - name: OLD build (9 Nov), iPhone 16 Plus
        run: node scripts/ci/webkit-check.mjs
        env: { HOME: /root, ONLY: iPhone 16 Plus, URL: 'https://27ffce5f.aayera.pages.dev' }
      - name: CURRENT build, iPhone 16 Plus
        run: node scripts/ci/webkit-check.mjs
        env: { HOME: /root, ONLY: iPhone 16 Plus, URL: 'https://1f57b403.aayera.pages.dev' }
